<h2 mat-dialog-title>{{ 'categories.moveTitle' | translate: { name: data.category.name } }}</h2>
<mat-dialog-content>
  <mat-form-field>
    <mat-label>{{ 'categories.moveTarget' | translate }}</mat-label>
    <mat-select [formControl]="newParentId">
      <mat-option [value]="null">{{ 'categories.moveRoot' | translate }}</mat-option>
      @for (target of targets; track target.id) {
        <mat-option [value]="target.id">
          <span [style.padding-left.px]="target.depth * 16">{{ target.name }}</span>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button matButton="filled" [disabled]="submitting()" (click)="submit()">
    {{ 'categories.moveSubmit' | translate }}
  </button>
</mat-dialog-actions>
